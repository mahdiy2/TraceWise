services:
  stacktrace:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STACKTRACE_API_TOKEN: ${STACKTRACE_API_TOKEN:?Set STACKTRACE_API_TOKEN in .env}
      STACKTRACE_MAPPING_LIMIT: ${STACKTRACE_MAPPING_LIMIT:-52428800}
      STACKTRACE_APK_LIMIT: ${STACKTRACE_APK_LIMIT:-524288000}
      STACKTRACE_CONCURRENCY: ${STACKTRACE_CONCURRENCY:-2}
    volumes:
      - studio-data:/data
    restart: unless-stopped
volumes:
  studio-data:
